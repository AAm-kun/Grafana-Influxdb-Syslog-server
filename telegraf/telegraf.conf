[[inputs.syslog]]
  server = "tcp://telegraf:6514"
[[outputs.influxdb_v3]] 
  urls = ["http://influxdb:8181"]

  ## Token for authentication, provided from the InfluxDB volume at startup.
  token = "${INFLUX_TOKEN}"

  ## Destination database to write into.
  database = "${INFLUX_DATABASE}"

  insecure_skip_verify = true
